<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Winyu Hybrid Film</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=block" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="sound.js"></script>
<style>
:root{
  --bg:#faf7f2; --ink:#1f1b3a; --muted:#6b6785; --violet:#7c3aed;
  --coral-ink:#e11d48; --coral-soft:#ffe4e8; --green:#059669; --green-soft:#dcf5ea; --line:rgba(49,46,129,.13);
  --shadow:0 18px 40px -12px rgba(49,46,129,.22), 0 2px 6px rgba(49,46,129,.06);
  --s-ink:#0f172a; --s-ink2:#334155; --s-muted:#64748b; --s-faint:#94a3b8; --s-line:#e8eaf2; --s-soft:#f6f7fb;
  --s-indigo:#4f46e5; --s-red:#e11d48; --s-redbg:#ffe4e6; --s-green:#047857; --s-greenbg:#e7f8ef; --s-amber:#b45309; --s-amberbg:#fef3c7; --s-ind50:#eef2ff;
  --grad:linear-gradient(135deg,#4f46e5 0%,#7c3aed 55%,#fb7185 100%);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#ece7df;overflow:hidden;font-family:'Anuphan',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#viewport{position:absolute;left:0;top:0;right:0;bottom:64px;display:flex;align-items:center;justify-content:center}
#frame{position:relative;overflow:hidden;border-radius:10px;box-shadow:0 20px 60px rgba(31,27,58,.18)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--bg);overflow:hidden;opacity:0}
#stage.ready{opacity:1}
body.capture{background:var(--bg)}
body.capture #viewport{bottom:0}
body.capture #frame{border-radius:0;box-shadow:none}
body.capture #transport{display:none}
svg{display:block}
#ground{position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 62%,rgba(196,181,253,.22),rgba(196,181,253,0) 70%)}
#world,#fx{position:absolute;left:0;top:0}
#labels,#ui,#devs{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none}
.lbl{position:absolute;left:0;top:0;will-change:transform,opacity;white-space:nowrap}
.t80{font-size:80px;line-height:1.3;font-weight:600;letter-spacing:-.01em}
.t76{font-size:76px;line-height:1.3;font-weight:600;letter-spacing:-.01em}
.t48{font-size:48px;line-height:1.3;font-weight:700;letter-spacing:-.3px}
.t44{font-size:44px;line-height:1.35;font-weight:700;letter-spacing:-.005em}
.t32{font-size:32px;line-height:1.45;font-weight:600}
.t30{font-size:30px;line-height:1.45}
.t26{font-size:26px;line-height:1.5;font-weight:500}
.t24{font-size:24px;line-height:1.5}
.b{font-weight:700}.b5{font-weight:500}.b6{font-weight:600}.b7{font-weight:700}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.ab{position:absolute}

#title{position:absolute;left:96px;top:84px;width:1500px;height:120px}
.hl{position:absolute;left:0;top:0;white-space:nowrap;opacity:0;color:var(--ink)}
.hl em{font-style:normal;background:linear-gradient(90deg,#4f46e5,#7c3aed 60%,#fb7185);-webkit-background-clip:text;background-clip:text;color:transparent}
#bug{position:absolute;right:96px;top:114px;display:flex;align-items:center;gap:16px}
#bug .tile{width:56px;height:56px;border-radius:16px;background:var(--grad);display:flex;align-items:center;justify-content:center}
#bug .tile svg{width:44px;height:44px}

.pill{display:inline-flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:6px 22px;box-shadow:var(--shadow)}
.pill.sys{padding:4px 20px}
.chip{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:2px 16px;font-size:26px;line-height:1.5;font-weight:600}
.chip.ok{background:var(--green-soft);color:var(--green)}
.chip.soft{background:#efedfb;color:#4338ca}
.chip svg{width:22px;height:22px;flex:none}
.stack{display:flex;flex-direction:column;align-items:center;gap:12px}
.numcard{display:flex;align-items:center;gap:16px;background:#fff;border:1.5px solid var(--line);border-radius:24px;padding:10px 26px;box-shadow:var(--shadow)}
.spin{width:26px;height:26px;border-radius:50%;border:4px solid #ddd6fe;border-top-color:var(--violet);flex:none}
.lockb{width:64px;height:64px;border-radius:50%;background:#fff;border:1.5px solid #fda4af;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.lockb svg{width:34px;height:34px}

.ui{position:absolute;left:0;top:0;opacity:0;will-change:transform,opacity}
.card{background:#fff;border:1.5px solid var(--line);border-radius:32px;box-shadow:0 40px 80px -30px rgba(49,46,129,.35),0 4px 12px rgba(49,46,129,.06)}
#qbox{display:flex;align-items:center;gap:20px;padding:22px 40px 22px 24px;border-radius:999px;width:610px}
#qbox .mini{width:60px;height:60px;border-radius:18px;background:var(--grad);display:flex;align-items:center;justify-content:center;flex:none}
#qbox .mini svg{width:46px;height:46px}
.caret{display:inline-block;width:4px;height:48px;background:var(--violet);margin-left:4px;vertical-align:-8px;border-radius:2px}
.say{padding:12px 26px;border-radius:28px 28px 28px 8px;color:#fff;background:linear-gradient(135deg,#4f46e5,#7c3aed);white-space:nowrap;box-shadow:0 14px 30px -14px rgba(79,70,229,.6);transform-origin:0 100%}
.memc{display:flex;align-items:center;gap:16px;padding:14px 26px 14px 16px;border-radius:24px;white-space:nowrap}
.memc .mi{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,#7c3aed,#fb7185);display:flex;align-items:center;justify-content:center}
.memc .mi svg{width:36px;height:36px}
#env{width:150px;height:104px}
#bell{width:88px;height:88px}
#bell .bc{width:88px;height:88px;border-radius:50%;background:#fff;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
#bell .bc svg{width:46px;height:46px}
#bell .badge{position:absolute;right:-12px;top:-12px;min-width:44px;height:44px;border-radius:22px;background:var(--coral-ink);color:#fff;font-size:26px;line-height:44px;font-weight:700;text-align:center;border:3px solid #fff}
#mini{padding:22px 30px;border-radius:28px;display:flex;flex-direction:column;gap:2px}
#mini .r{display:flex;align-items:center;gap:14px}
#end{width:1920px;height:1080px;display:flex;flex-direction:column;align-items:center;justify-content:center}
#end .big{width:168px;height:168px;border-radius:48px;background:var(--grad);display:flex;align-items:center;justify-content:center;box-shadow:0 40px 80px -30px rgba(124,58,237,.6)}
#end .big svg{width:132px;height:132px}
#end .wm{margin-top:36px}
#end .tag{margin-top:8px;color:var(--muted);font-weight:500}

.dev{position:absolute;left:0;top:0;transform-origin:0 0;opacity:0;visibility:hidden;font-family:'Anuphan',sans-serif;color:var(--s-ink)}
svg.i{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.win{background:#fff;border-radius:22px;border:1px solid rgba(15,23,42,.08);overflow:hidden;clip-path:inset(0 round 22px);box-shadow:0 60px 110px -40px rgba(49,46,129,.42),0 18px 40px -16px rgba(30,27,75,.18)}
.tb{position:absolute;left:0;top:0;right:0;height:52px;background:#fbfbfd;border-bottom:1px solid #eef0f5}
.lights{position:absolute;left:22px;top:19px;display:flex;gap:9px}
.lights i{width:14px;height:14px;border-radius:50%;display:block}
.lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.url{position:absolute;left:50%;top:8px;height:36px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:0 20px;border-radius:18px;background:#f1f2f6;color:var(--s-muted)}
.url svg.i{width:18px;height:18px}
.who{position:absolute;right:12px;top:6px;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px 0 6px;border-radius:20px;background:var(--s-ind50);color:#3730a3;white-space:nowrap}
.who .av{width:30px;height:30px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--s-indigo)}
.who .av svg.i{width:18px;height:18px}
.who.mid{right:auto;left:50%;transform:translateX(-50%)}
.logo{display:flex;align-items:center;justify-content:center;background:var(--grad);flex:none}
.side{position:absolute;left:0;top:52px;bottom:0;width:84px;background:#fff;border-right:1px solid #eef0f5}
.side .logo{position:absolute;left:20px;top:18px;width:44px;height:44px;border-radius:13px}
.side .logo svg{width:32px;height:32px}
.sbtn{position:absolute;left:20px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#475569}
.sact{position:absolute;left:18px;width:48px;height:48px;border-radius:14px;background:var(--s-ind50)}
.chat{position:absolute;left:84px;top:52px;right:0;bottom:0;overflow:hidden;background:radial-gradient(ellipse 60% 70% at 85% 10%,rgba(199,210,254,.45),rgba(199,210,254,0) 70%),radial-gradient(ellipse 55% 60% at 30% 100%,rgba(251,207,232,.35),rgba(251,207,232,0) 70%),#f8f8fd}
.apphead{position:absolute;right:20px;top:14px;display:flex;gap:12px;z-index:3}
.apphead span{width:46px;height:46px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(30,27,75,.1);display:flex;align-items:center;justify-content:center;color:#475569}
.apphead span.av{background:var(--grad);color:#fff}
.eyebrow{color:var(--s-muted)}
.fwd{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 16px;border-radius:20px;border:1.5px solid #e2e4ee;background:#fff;color:var(--s-ink2);white-space:nowrap}
.fwd svg.i{width:20px;height:20px}
.foot{display:flex;align-items:center;justify-content:space-between;margin-top:16px;color:var(--s-muted)}
.tabs{display:inline-flex;gap:4px;padding:5px;border-radius:999px;background:#fff;border:1px solid #eceef4;box-shadow:0 4px 14px -8px rgba(30,27,75,.2)}
.tabs span{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:22px;color:#475569;white-space:nowrap}
.tabs span.on{background:var(--s-ink);color:#fff}
.tabs svg.i{width:20px;height:20px}
.step{display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 18px 0 8px;border-radius:23px;border:1.5px solid #eceef4;background:#fff;color:var(--s-faint);white-space:nowrap}
.step b{width:30px;height:30px;border-radius:50%;background:#f1f2f6;color:var(--s-muted);display:flex;align-items:center;justify-content:center;font-weight:600}
.step.on{background:var(--s-ink);border-color:var(--s-ink);color:#fff}
.step.on b{background:#fff;color:var(--s-ink)}
.step.done{color:var(--s-green);border-color:#bfe9d3;background:var(--s-greenbg)}
.step.done b{background:#10b981;color:#fff}
.layer{position:absolute;inset:0;opacity:0;visibility:hidden}
.feed{position:absolute;inset:0;-webkit-mask-image:linear-gradient(to bottom,transparent 200px,#000 226px);mask-image:linear-gradient(to bottom,transparent 200px,#000 226px)}
.sc-bubble{position:absolute;padding:10px 26px;border-radius:26px 26px 8px 26px;background:#4f46e5;color:#fff;white-space:nowrap;transform-origin:100% 100%}
.sc-card{position:absolute;background:#fff;border:1.5px solid var(--s-line);border-radius:28px;box-shadow:0 26px 60px -30px rgba(49,46,129,.28)}
.sc-pill{display:inline-flex;align-items:center;gap:4px;height:40px;padding:0 14px;border-radius:20px;white-space:nowrap;font-weight:600}
.sc-pill svg.i{width:22px;height:22px;stroke-width:2.4}
.pred{background:var(--s-redbg);color:var(--s-red)}
.sc-row{display:flex;align-items:center;gap:16px}
.track{height:10px;border-radius:5px;background:#f0f1f6;margin-top:8px;overflow:hidden}
.fill{height:10px;border-radius:5px;background:#6366f1}
.fill.hot{background:linear-gradient(90deg,#fb7185,#e11d48)}
.piece{position:relative}
.sc-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 24px;border-radius:26px;white-space:nowrap;font-weight:600}
.sc-btn svg.i{width:24px;height:24px}
.bdark{background:var(--s-ink);color:#fff}
.bline{border:1.5px solid #dfe2ea;color:var(--s-ink2);background:#fff}
.bgrad{background:var(--grad);color:#fff}
.dpane{position:absolute;top:104px;width:620px;height:500px;background:#fff;border:1.5px solid var(--s-line);border-radius:28px;box-shadow:0 26px 60px -30px rgba(49,46,129,.28);overflow:hidden}
.dlab{position:absolute;left:24px;top:20px;height:44px;display:flex;align-items:center;gap:10px;padding:0 16px 0 6px;border-radius:22px;white-space:nowrap}
.wline{height:16px;border-radius:8px;background:#e4e6ee;margin-bottom:22px}
.drow{display:flex;align-items:center;gap:16px;height:48px;border-radius:14px;padding:0 12px;margin:0 -12px 12px}
.drow .lb{width:230px;flex:none;white-space:nowrap}
.drow .tk,.crow .tk{flex:1;height:14px;border-radius:7px;background:#f0f1f6;overflow:hidden}
.drow .fl,.crow .fl{display:block;height:14px;border-radius:7px;background:#6366f1}
.drow .vl{width:180px;flex:none;text-align:right;white-space:nowrap;font-weight:600}
.drow.hot,.crow.hot{background:#fff1f2}
.drow.hot .lb,.crow.hot .lb{color:#be123c;font-weight:600}
.drow.hot .fl,.crow.hot .fl{background:linear-gradient(90deg,#fb7185,#e11d48)}
.qchip{position:absolute;top:28px;height:52px;display:flex;align-items:center;padding:0 22px;border-radius:26px 26px 8px 26px;background:#4f46e5;color:#fff;white-space:nowrap}
.rcard{position:absolute;top:104px;width:410px;height:500px;background:#fff;border:1.5px solid var(--s-line);border-radius:28px;box-shadow:0 26px 60px -30px rgba(49,46,129,.28);overflow:hidden;padding:24px}
.crow{border-radius:12px;padding:2px 10px 8px;margin:0 -10px 6px}
.crow .tp{display:flex;justify-content:space-between;align-items:center;height:38px;white-space:nowrap}
.prow{display:flex;align-items:center;gap:14px;height:78px}
.prow img{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 2px #fff,0 3px 10px -4px rgba(30,27,75,.3)}
.prow .tx{min-width:0;line-height:1.35}
.prow .tx div{white-space:nowrap}
.cursor{position:absolute;left:0;top:0;width:44px;height:44px;opacity:0}
.cursor svg{width:44px;height:44px;display:block;filter:drop-shadow(0 4px 6px rgba(15,23,42,.28))}
.ripple{position:absolute;left:0;top:0;width:80px;height:80px;margin:-40px 0 0 -40px;border-radius:50%;border:3px solid rgba(124,58,237,.7);background:rgba(124,58,237,.12);opacity:0}

#phone{width:376px;height:736px;border-radius:64px;background:#1c1b29;padding:12px;box-shadow:0 60px 110px -40px rgba(49,46,129,.5),0 18px 40px -16px rgba(30,27,75,.25),inset 0 0 0 2px #3a3950}
#pscr{position:relative;width:352px;height:712px;border-radius:52px;background:#fff;overflow:hidden;clip-path:inset(0 round 52px)}
.island{position:absolute;left:121px;top:12px;width:110px;height:32px;border-radius:16px;background:#1c1b29}
.pchip{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px 0 6px;border-radius:20px;background:var(--s-ind50);color:#3730a3;white-space:nowrap}
.pchip .av{width:30px;height:30px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--s-indigo)}
.pchip .av svg.i{width:18px;height:18px}
.pcomp{position:absolute;left:16px;right:16px;bottom:36px;min-height:64px;border-radius:32px;border:1.5px solid #e2e4ee;background:#fff;padding:14px 64px 14px 22px;box-shadow:0 10px 30px -14px rgba(49,46,129,.25);white-space:nowrap}
.psend{position:absolute;right:9px;bottom:9px;width:44px;height:44px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center}
.psend svg.i{width:22px;height:22px;stroke-width:2.4}
.pcomp{border:2px solid transparent;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(90deg,#7c3aed,#4f46e5 50%,#22d3ee) border-box}
.pcaret{display:inline-block;width:3px;height:28px;background:var(--s-indigo);margin-left:3px;vertical-align:-6px;border-radius:2px}
.home-ind{position:absolute;left:116px;bottom:10px;width:120px;height:5px;border-radius:3px;background:#1c1b29}
.balr .track{height:8px;margin-top:6px}
.balr .fill{height:8px}
.touch{position:absolute;left:0;top:0;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(15,23,42,.22);border:2.5px solid rgba(255,255,255,.9);box-shadow:0 4px 14px rgba(15,23,42,.25);opacity:0}

#split{width:1728px;height:700px}
#split .win{position:absolute}
.tog{position:relative;width:100px;height:56px;border-radius:28px;flex:none}
.tog .knob{position:absolute;left:6px;top:6px;width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(15,23,42,.25)}
.lock6{position:absolute;left:30px;top:70px;height:62px;gap:12px;color:#3730a3;opacity:0}
.lock6 .lk{width:56px;height:56px;border-radius:50%;background:#fff;box-shadow:0 6px 18px -6px rgba(30,27,75,.35);display:flex;align-items:center;justify-content:center}

.t40{font-size:40px;line-height:1.3;font-weight:600}
.app{font-family:'Noto Sans Thai',sans-serif;color:#0f172a;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
.app .ab{position:absolute}
.app .row{display:flex;align-items:center}
.app .card{position:absolute;background:#fff;border:1px solid #e6e8f0;border-radius:24px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 10px 30px -18px rgba(30,27,75,.22)}
.app .eyebrow{font-size:12px;line-height:16px;color:#64748b}
.app .verdict{font-size:19px;line-height:1.35;font-weight:600;letter-spacing:-.01em}
.app .title{font-size:15px;line-height:1.35;font-weight:600;letter-spacing:-.01em}
.app .hero{font-size:30px;line-height:1;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.app .unit{font-size:14px;color:#64748b}
.app .body{font-size:14px;line-height:20px}
.app .small{font-size:13px;line-height:18px}
.app .cap{font-size:12px;line-height:16px;color:#64748b}
.app .tiny{font-size:11px;line-height:14px}
.app .strong{font-weight:600}
.app .muted{color:#64748b}
.app .num{font-variant-numeric:tabular-nums}
.app .tile{background:#f6f7fb;border-radius:16px;padding:10px 12px}
.app .tile .v{font-size:20px;line-height:26px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.app .chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:999px;border:1px solid #e6e8f0;background:#fff;font-size:14px;color:#0f172a;white-space:nowrap;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.app .chip svg{width:16px;height:16px;flex:none;color:#6366f1}
.app .tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.app .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 16px;border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap}
.app .btn svg{width:15px;height:15px}
.app .ask{position:absolute;padding:6px 14px;border-radius:18px 18px 6px 18px;background:#4f46e5;color:#fff;font-size:14px;line-height:20px;white-space:nowrap;transform-origin:100% 100%}
.app .track{height:6px;border-radius:3px;background:#eef0f5;overflow:hidden;margin-top:6px}
.app .fill{height:6px;border-radius:3px;background:#6366f1}
.app svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

const T = {

};
const MOVES = ['push1', 'pull1', 'push2', 'pull2', 'push3', 'pull3', 'push4', 'pull4', 'push5', 'pull5', 'push6', 'pull6'];
const MOVE_BEATS = 2;
const LENGTH = Math.round(78.2 * 30) / 30;
const GRID = Sound.grid({ tempo: { on: T.memc } }, LENGTH);
for (const key of MOVES) { const at = GRID.snap(T[key]); T[key] = [at, at + MOVE_BEATS * GRID.beat]; }
T.logo = GRID.snap(T.logo, 0.25);
T.card1 = T.push1[1] - 0.45;

T.panes = T.push3[1] - 0.7;

T.chips = [T.dyn - 0.05, T.dyn + 0.2, T.dyn + 0.45];
const HL_IN = [['hl0', -1], ['hl1', T.sun + 0.15], ['hl2', T.memIn - 0.4], ['hlA', T.wall], ['hlB', T.dyn], ['hl3', T.fwd], ['hl4', T.leaveIn - 0.05], ['hl5', T.permIn], ['hl6', T.connIn]].map(([id, a]) => [id, a < 0 ? a : GRID.snap(a, 2)]);
const HL_GAP = 0.45;

const SMALL_HITS = new Set(['hlB', 'hl5']);
const HLS = HL_IN.map(([id, a], i) => [id, a, i === 0 ? T.ask + 0.7 : i < HL_IN.length - 1 ? HL_IN[i + 1][1] - HL_GAP : T.pull6[1]]);
const UNIT = 72;
const FIG = 1.35;
const C30 = Math.cos(Math.PI / 6);
const LINE = 'rgba(49,46,129,.28)';
const ISO_X = 54.7356, ISO_Z = 45, ISO_FLAT = Math.sqrt(2 / 3);
const pe = n => gsap.parseEase(n);
const EOX = pe('expo.out'), EO3 = pe('power3.out'), EI3 = pe('power3.in'), EIO3 = pe('power3.inOut'), EBK = pe('back.out(1.7)'), EXIO = pe('expo.inOut'), LIN = p => p;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));

const k = (t, a, d, e = EO3) => e(clamp((t - a) / d));

const typedCount = (t, [a, d], G) => Math.round(k(t, a, d, LIN) * G.length);
const $ = id => document.getElementById(id);
let RT = 0;

const dayMonth = d => d.replace(/\s\d{4}$/, '');

const LEAVE = graphemes(`ขอลาพักร้อน ${dayMonth(FACTS.leave.from)} – ${dayMonth(FACTS.leave.to)}`);

const TEAM_SHOWN = 3;
const CREDIT = FACTS.drops[0].hypothesis.match(/น่าจะติดปัญหา\S+/)[0];

const SHARE_COLORS = ['#4f46e5', '#a78bfa', '#10b981', '#f59e0b'];
const SEVERITY_P1 = 'ต้องรีบดู';

const CONN_Q = graphemes(`อุปกรณ์ของทีม${FACTS.spotlight}`);

const UNIT_COLORS = ['#4f46e5', '#a78bfa'];
const WALL_LINES = [100, 96, 99, 92, 97, 94, 100, 95, 98, 72];

const short = role => role.split(' ')[0];

const M = {
  stone: { t: '#ffffff', l: '#f1ebe3', r: '#e4dccf' },
  indigo: { t: '#e3e6ff', l: '#c5cbfb', r: '#a9b0f4' },
  violet: { t: '#eee7ff', l: '#d8cbfd', r: '#c0abf8' },
  coral: { t: '#ffe5e8', l: '#fdc6cd', r: '#f9a6b2' },
  sky: { t: '#e2f1fb', l: '#c4e1f5', r: '#a5cfee' },
  mint: { t: '#ddf5eb', l: '#bde8d5', r: '#9cd9be' },
  amber: { t: '#fdf1d7', l: '#f8e0b0', r: '#f1cc88' },
  hub: { t: 'url(#gHubTop)', l: '#8187f3', r: '#6d5fe2' },
  gate: { t: '#ffe5e8', l: '#fb9fae', r: '#f47c92' },
};
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mixHex = (a, b, q) => { const A = hex(a), B = hex(b); return 'rgb(' + A.map((v, i) => Math.round(lerp(v, B[i], q))).join(',') + ')'; };
const mixMat = (a, b, q) => ({ t: mixHex(a.t, b.t, q), l: mixHex(a.l, b.l, q), r: mixHex(a.r, b.r, q) });

let cam = { cx: 960, cy: 690, z: 1 };
const S = () => UNIT * cam.z;
const P = (x, y, z = 0) => { const s = S(); return [cam.cx + (x - y) * C30 * s, cam.cy + (x + y) * 0.5 * s - z * s]; };
const look = (x, y, sx, sy, z, h = 0) => ({ cx: sx - (x - y) * C30 * UNIT * z, cy: sy - (x + y) * 0.5 * UNIT * z + h * UNIT * z, z });
const pts = a => a.map(p => f1(p[0]) + ',' + f1(p[1])).join(' ');
const poly = (a, fill) => `<polygon points="${pts(a)}" fill="${fill}" stroke="${LINE}" stroke-width="1.3" stroke-linejoin="round"/>`;

function box(x, y, z, w, d, h, m, o = 1) {
  if (o <= 0.002) return '';
  h = Math.max(h, 0.002);
  const x1 = x + w, y1 = y + d, z1 = z + h;
  const top = [P(x, y, z1), P(x1, y, z1), P(x1, y1, z1), P(x, y1, z1)];
  const left = [P(x, y1, z), P(x1, y1, z), P(x1, y1, z1), P(x, y1, z1)];
  const right = [P(x1, y, z), P(x1, y1, z), P(x1, y1, z1), P(x1, y, z1)];
  return `<g opacity="${o.toFixed(3)}">${poly(left, m.l)}${poly(right, m.r)}${poly(top, m.t)}</g>`;
}
const boxC = (cx, cy, z, w, d, h, m, o) => box(cx - w / 2, cy - d / 2, z, w, d, h, m, o);
function shadow(cx, cy, w, d, o) {
  const g = 0.18;
  const a = [P(cx - w / 2 - g, cy - d / 2 + g * 2), P(cx + w / 2 + g * 2, cy - d / 2 + g * 2), P(cx + w / 2 + g * 2, cy + d / 2 + g * 2), P(cx - w / 2 - g, cy + d / 2 + g * 2)];
  return `<polygon points="${pts(a)}" fill="rgba(60,50,120,${(0.07 * o).toFixed(3)})"/>`;
}
function windows(cx, cy, w, d, z0, h, rows, o) {
  if (h < 0.5 || o <= 0.01) return '';
  let s = '';
  const x0 = cx - w / 2, x1 = cx + w / 2, y0 = cy - d / 2, y1 = cy + d / 2;
  const nRows = Math.max(1, Math.floor((h - 0.25) / 0.38));
  for (let r = 0; r < Math.min(rows, nRows); r++) {
    const za = z0 + h - 0.3 - r * 0.38, zb = za - 0.16;
    if (zb < z0 + 0.12) break;

const depthOf = (d) => d.ww * d.lh / d.lw;
function visitU(v, t) {
  for (const [push, pull] of v.moves) {
    if (t < push[0] || t >= pull[1]) continue;
    if (t < push[1]) return EIO3((t - push[0]) / (push[1] - push[0]));
    if (t < pull[0]) return 1;
    return 1 - EIO3((t - pull[0]) / (pull[1] - pull[0]));
  }
  return 0;
}
function projectOn(W, x, y, z) { const s = UNIT * W.z; return [W.cx + (x - y) * C30 * s, W.cy + (x + y) * 0.5 * s - z * s]; }
function pose(v, W, u) {
  const d = v.dev;
  const [hx, hy] = projectOn(W, v.at[0], v.at[1], PLINTH);
  const kk = UNIT * W.z * d.ww / (d.lw * ISO_FLAT);
  const [fx, fy, as] = d.flat;
  const sc = Math.exp(lerp(Math.log(kk), Math.log(as), u));
  const w = u <= 0 ? 0 : u >= 1 ? 1 : (1 / kk - 1 / sc) / (1 / kk - 1 / as);
  const r = 1 - EIO3(clamp(u / 0.92));
  return { k: kk, S: sc, x: lerp(hx, fx, w), y: lerp(hy, fy, w), w, ax: ISO_X * r, az: ISO_Z * r };
}

}
const showOf = (v, t) => k(t, v.show[0], 0.45, EO3) * (1 - k(t, v.show[1] - 0.45, 0.45, EI3));

const CAM_KEYS = [
  [T.sun - 0.3, 1.2, V.morning], [T.pull1[1] + 0.05, 1.0, V.memory], [T.pull3[0] - 0.6, 0.5, V.forward],
  [T.fwdOut - 0.2, 0.9, V.crane, EIO3], [T.fwdOut + 0.3, 1.05, V.leave, EIO3], [T.leaveOut - 0.1, 1.0, V.perm], [T.permOut - 0.1, 1.0, V.conn],
  [T.pull6[0] - 0.6, 0.5, V.wide], [T.logo + 0.8, 1.2, V.open],

function townCam(t) {
  let cur = V.open;
  for (const [at, dur, view, ease = EXIO] of CAM_KEYS) {
    if (t <= at) break;
    const q = ease(clamp((t - at) / dur));
    cur = { cx: lerp(cur.cx, view.cx, q), cy: lerp(cur.cy, view.cy, q), z: lerp(cur.z, view.z, q) };
  }

}
const ZOOM_CAP = 1.8, TOWN_ZOOM_CAP = 1.6;
/** How far the town zooms while a screen grows by `ratio`: with the screen at first, then easing to `cap`, so the town never blows up into giant blocks. */
const townZoom = (ratio, cap) => 1 + (cap - 1) * Math.tanh((ratio - 1) / (cap - 1));
function solve(t) {
  const W = townCam(t);
  const active = VISITS.find(v => visitU(v, t) > 0);
  let world = W;
  const poses = new Map();
  if (active) {
    const p = pose(active, W, visitU(active, t));
    poses.set(active, p);
    const [fx, fy] = active.dev.flat, pin = active.town?.pin ?? [fx, fy];
    world = look(active.at[0], active.at[1], p.x + (pin[0] - fx) * p.w, p.y + (pin[1] - fy) * p.w, W.z * townZoom(p.S / p.k, active.town ? TOWN_ZOOM_CAP : ZOOM_CAP), PLINTH);
  }
  for (const v of VISITS) if (!poses.has(v)) poses.set(v, pose(v, world, visitU(v, t)));
  const shown = VISITS.filter(v => !v.town && t > v.show[0] && t < v.show[1]);
  const inside = Math.max(0, ...shown.map(v => k(visitU(v, t), 0.25, 0.55, LIN)));
  const away = Math.max(0, ...shown.map(v => k(visitU(v, t), 0, 0.2, LIN)));
  return { world, poses, inside, away };
}

function cursorAt(keys, t) {
  if (t <= keys[0][0]) return [keys[0][1], keys[0][2]];
  for (let i = 1; i < keys.length; i++) if (t < keys[i][0]) { const a = keys[i - 1], b = keys[i], p = EIO3((t - a[0]) / (b[0] - a[0])); return [lerp(a[1], b[1], p), lerp(a[2], b[2], p)]; }
  const l = keys[keys.length - 1]; return [l[1], l[2]];
}
function trendSvg(prog) {
  const weeks = FACTS.trend.weeks, vals = weeks.map(w => w.value);
  const lo = Math.min(...vals), hi = Math.max(...vals), n = weeks.length - 1;
  const pt = i => [8 + i / n * 504, 24 + (hi - vals[i]) / (hi - lo) * 84];
  const shown = [];
  for (let i = 0; i <= n; i++) { if (i <= prog) shown.push(pt(i)); else { const q = prog - (i - 1); if (q > 0) { const a = pt(i - 1), b = pt(i); shown.push([lerp(a[0], b[0], q), lerp(a[1], b[1], q)]); } break; } }
  let s = `<line x1="0" y1="122" x2="520" y2="122" stroke="#eceef4" stroke-width="1"/>`;
  if (shown.length > 1) {
    const last = shown[shown.length - 1];
    s += `<defs><linearGradient id="trg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6366f1" stop-opacity=".22"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></linearGradient></defs>`;

    ...typed(T.connAsk, CONN_Q),
    { at: T.connSend, sfx: 'send' },
    { at: T.connAnswer + 0.35, sfx: 'pop', step: 3 },
    { at: T.logo, sfx: 'sting' },
    ...HLS.filter(([, inT]) => inT >= 0).map(([id, at]) => ({ at, sfx: 'hit', step: SMALL_HITS.has(id) ? 1 : 0 })),
  ],
};
let rendered = null;
window.film = { length: LENGTH, render, score: SOUND, audio: () => (rendered ??= Sound.renderScore(SOUND, LENGTH)) };

const stage = $('stage'), frame = $('frame');
const capture = /capture/.test(location.search);
if (capture) document.body.classList.add('capture');
function fit() {
  const vw = window.innerWidth, vh = window.innerHeight - (capture ? 0 : 64);
  const sc = capture ? 1 : Math.min((vw - 32) / 1920, (vh - 24) / 1080);
  stage.style.transform = `scale(${sc})`;
  frame.style.width = 1920 * sc + 'px';
  frame.style.height = 1080 * sc + 'px';
}
window.addEventListener('resize', fit);
fit();

const scrub = $('scrub'), tm = $('tm'), ppi = $('ppi');
scrub.max = LENGTH;
let playing = !capture, cur = 0, last = null;
const speaker = capture ? null : Sound.speaker(window.film);
const drawPP = () => { ppi.innerHTML = playing ? '<rect x="3" y="2" width="3.5" height="12" fill="#fff"/><rect x="9.5" y="2" width="3.5" height="12" fill="#fff"/>' : '<path d="M4 2 L14 8 L4 14 Z" fill="#fff"/>'; };
const show = () => { render(cur); scrub.value = cur; tm.textContent = cur.toFixed(1) + ' / ' + LENGTH.toFixed(1) + ' s'; };
$('pp').onclick = () => { playing = !playing; last = null; drawPP(); speaker?.sync(cur, playing); };
scrub.oninput = () => { cur = parseFloat(scrub.value); show(); speaker?.sync(cur, playing); };
$('snd').onclick = async () => { const on = await speaker.toggle(); $('snd').setAttribute('aria-pressed', String(on)); speaker.sync(cur, playing); };
function loop(ts) {
  if (playing) { const heard = speaker?.clock(); if (heard != null) cur = heard; else if (last !== null) cur = (cur + (ts - last) / 1000) % LENGTH; last = ts; show(); } else last = null;
  requestAnimationFrame(loop);
}
await Promise.all([
  document.fonts.load('600 80px Anuphan', 'ภาคไหน'), document.fonts.load('700 48px Anuphan', '1,110.2'),
  document.fonts.load('600 32px Anuphan', 'ภาค'), document.fonts.load('500 34px Anuphan', 'ภาค'), document.fonts.load('600 40px Anuphan', 'ภาค'), document.fonts.load('700 96px Anuphan', '96.3%'),
]);
await document.fonts.ready;
await Promise.all([...document.images].map(img => img.decode().catch(() => null)));
measure();
drawPP();
stage.classList.add('ready');
const qt = new URLSearchParams(location.search).get('t');
if (qt !== null) { cur = parseFloat(qt); playing = false; drawPP(); }
show();
window.film.ready = true;
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
